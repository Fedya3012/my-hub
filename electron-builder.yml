appId: com.myhub.app
productName: My Hub
artifactName: MyHub-${env.APP_VERSION4}-${arch}-Setup.${ext}
directories:
  output: dist
files:
  - electron/**
  - web/**
  - build/icon.png
  - package.json
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: My Hub
portable:
  artifactName: MyHub-${env.APP_VERSION4}-portable.${ext}
publish:
  provider: github
  owner: Fedya3012
  repo: my-hub
  releaseType: release
