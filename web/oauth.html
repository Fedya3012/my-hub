<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Hub - Đăng nhập Google</title>
<style>body{font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#eef1f4;color:#223}main{max-width:420px;padding:24px;text-align:center}a{color:#2563eb}</style></head>
<body><main><h1>My Hub</h1><p id="m">Đang hoàn tất đăng nhập…</p><p><a id="a" hidden>Mở lại My Hub</a></p></main>
<script>
// Landing page of the Google sign-in done in the system browser. The token is in the URL hash.
const h = location.hash.slice(1), st = new URLSearchParams(h).get('state') || '', m = document.getElementById('m'), a = document.getElementById('a');
const back = (url) => { a.href = url; a.hidden = false; location.replace(url); m.textContent = 'Xong. Quay lại My Hub để tiếp tục.'; };
if (!h) m.textContent = 'Không có dữ liệu đăng nhập. Hãy bắt đầu lại từ My Hub.';
else if (st.startsWith('a.')) back('com.myhub.app://oauth#' + h);
else if (location.hostname === 'localhost') {
  fetch('/__oauth', { method: 'POST', body: h }).then(() => { m.textContent = 'Xong. Quay lại app My Hub để tiếp tục. Có thể đóng tab này.'; history.replaceState(null, '', location.pathname); })
    .catch(() => { m.textContent = 'Không gửi được cho app My Hub. Mở lại app và thử lại.'; });
} else if (st.startsWith('d.')) location.replace('http://localhost:47821/oauth.html#' + h);
else m.textContent = 'Phiên đăng nhập không hợp lệ.';
</script></body></html>
